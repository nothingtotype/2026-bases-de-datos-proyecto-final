<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
        input, select { padding: 6px; margin-right: 8px; margin-bottom: 8px; }
        button { padding: 6px 12px; cursor: pointer; }
        a { display: inline-block; margin-bottom: 20px; color: #0066cc; }
    </style>
</head>
<body>
    <a href="index.html">← Volver</a>
    <h1>Productos</h1>

    <form id="form-producto" onsubmit="crearProducto(event)">
        <input id="prod-nombre"      placeholder="Nombre"       required /><br>
        <input id="prod-descripcion" placeholder="Descripción"  /><br>
        <input id="prod-precio"      placeholder="Precio"       type="number" step="0.01" required /><br>
        <input id="prod-categoria"   placeholder="ID Categoría" type="number" /><br>
        <input id="prod-proveedor"   placeholder="ID Proveedor" type="number" /><br>
        <button type="submit">Agregar</button>
    </form>

    <table id="tabla-productos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Proveedor</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="app.js"></script>
    <script>cargarProductos();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Cambios</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
        a { display: inline-block; margin-bottom: 20px; color: #0066cc; }

        /* Legend */
        .leyenda { display: flex; gap: 20px; margin-top: 12px; font-size: 0.9rem; }
        .leyenda span { padding: 4px 10px; border-radius: 4px; }
        .creado   { background: #e6f9e6; }
        .editado  { background: #fff8e1; }
        .eliminado{ background: #fde8e8; }
    </style>
</head>
<body>
    <a href="index.html">← Volver</a>
    <h1>🕓 Historial de Cambios</h1>

    <div class="leyenda">
        <span class="creado">➕ Creado</span>
        <span class="editado">✏️ Editado</span>
        <span class="eliminado">🗑️ Eliminado</span>
    </div>

    <table id="tabla-historial">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tabla</th>
                <th>Operación</th>
                <th>ID Registro</th>
                <th>Descripción</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="app.js"></script>
    <script>cargarHistorial();</script>
</body>
</html>
